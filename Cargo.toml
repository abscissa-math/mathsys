[package]
name = "mathsys"
version = "2.0.1"
edition = "2024"
rust-version = "1.99"
authors = ["Alejandro Vaz <alejandro.vaz.myt@gmail.com>"]
description = "The Natural Language of Math."
license = "MIT"
repository = "https://github.com/alejandro-vaz/mathsys"

[lib]
name = "mathsys"
path = "lib/lib.rs"

[[bin]]
name = "mathsys"
path = "main.rs"

[[bench]]
name = "tokenizer"
harness = false

[profile.bench]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
debug = false

[dependencies]
enum_dispatch = "0.3"
enum-as-inner = "0.7"
elsa = "1.11"
issuing = "2.0"
systemstd = "5.1"
unhygienic2 = "0.1"

[dev-dependencies]
criterion = "0.8"
